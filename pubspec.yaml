name: apng_viewer
description: "APNG格式图片阅览器 - 支持APNG动画播放与预览大图，适配Android 16"
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image: ^4.9.2
  photo_view: ^0.15.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
