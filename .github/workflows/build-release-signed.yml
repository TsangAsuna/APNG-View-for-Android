name: Build & Release APK (Signed)

# 说明：
# 本工作流在 build-apk.yml 基础上增加了「正式签名」支持。
# 若要产出可供商店/正式分发的签名 APK，需在 GitHub 仓库 Settings > Secrets and variables > Actions 中配置以下 Secret：
#   KEYSTORE_BASE64   - 你的 keystore 文件经 base64 编码后的内容
#   KEYSTORE_PASSWORD - keystore 密码
#   KEY_ALIAS         - 密钥别名
#   KEY_PASSWORD      - 密钥密码
# 若未配置这些 Secret，则自动回退使用 debug 签名（仅测试用）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # 若配置了签名 Secret，则写入 key.properties 并让 Gradle 使用
      - name: Configure signing (if secrets present)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "KEYSTORE_BASE64 is set" 
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          ls -la android/app/upload-keystore.jks

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## APNG 阅览器 ${{ github.ref_name }}
            - 支持 APNG 动画逐帧播放
            - 支持静态 PNG 预览大图缩放
            - 适配 Android 16 (API 36)
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/*.aab
