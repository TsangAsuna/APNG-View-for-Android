name: Build Android APK

# 触发条件：
#   - 推送到 main / master 分支
#   - 创建或推送 v 开头的 tag（如 v1.0.0），此时会同时发布 GitHub Release
#   - 手动触发（Actions 页面点 Run workflow）
on:
  push:
    branches: [main, master]
    tags: ['v*']
    # 仅代码/配置/工作流变化才构建；README、docs 等文档改动不触发
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 取消重复/过时的同一分支构建，节省资源
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      # 1. 拉取源码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Java 17（AGP 9.x 需要 JDK 17+）
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 安装 Flutter SDK（锁定与本地一致的 3.47.2，保证可复现）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      # 4. 缓存 pub 依赖
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ runner.workspace }}/apng_viewer/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # 5. 安装项目依赖并静态检查
      - name: Flutter pub get & analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      # 6. 运行测试
      - name: Run tests
        run: flutter test

      # 7. 构建 Release APK
      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      # 8.（可选）构建 App Bundle，用于上架 Google Play
      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      # 9. 上传 APK / AAB 作为构建产物（Actions 页可下载）
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      # 10. 若推送的是 v 开头的 tag，自动创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: APNG 阅览器 ${{ github.ref_name }}
          body: |
            ## APNG 阅览器 ${{ github.ref_name }}

            - 支持 APNG 动画逐帧播放
            - 支持静态 PNG 预览大图缩放
            - 适配 Android 16 (API 36)
            - 应用图标：APNG 主题自定义图标
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/*.aab
          generate_release_notes: true
